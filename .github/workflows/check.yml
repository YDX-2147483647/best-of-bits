name: Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  yaml:
    name: Check projects.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Fetch projects.yaml
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            projects.yaml
          sparse-checkout-cone-mode: false
      - name: Get names
        uses: mikefarah/yq@master
        id: projects-names
        with:
          cmd: yq '.projects.[] | line + " " + .name' projects.yaml
      - name: Make sure names are unique
        run: |
          duplicates=$(echo "${{ steps.projects-names.outputs.result }}" | sort --key 2 | uniq --skip-fields=1 --all-repeated)

          if [ -n "$duplicates" ]; then
            echo "# Some projects' names are duplicate" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$duplicates" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  build-typ:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch README
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            README.md
            justfile
            scripts/history_to_json.py
            typ/*
            history/*
            config/*
            projects.yaml
            .github/typst-versions.yaml
          sparse-checkout-cone-mode: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: astral-sh/setup-uv@v7
      - uses: typst-community/setup-typst@v5
        with:
          typst-versions-file: .github/typst-versions.yaml

      - run: just build-typ
